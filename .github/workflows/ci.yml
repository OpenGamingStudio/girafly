name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Test de bout en bout (Chrome, 4 tailles, portrait, pause)
        run: |
          npm i --no-save --no-package-lock --ignore-scripts puppeteer-core
          (cd dist && python3 -m http.server 4173 &) ; sleep 2
          CHROME=$(which google-chrome || which chromium-browser || which chromium) node e2e/check.mjs http://127.0.0.1:4173 e2e-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shots
          path: e2e-shots
